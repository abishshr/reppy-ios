name: Deploy to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Auto-increment Build Number
        working-directory: ios
        run: |
          # Read current build number
          CURRENT=$(grep "CURRENT_PROJECT_VERSION:" project.yml | sed 's/.*: "\(.*\)"/\1/')
          # Increment by 1
          NEW=$((CURRENT + 1))
          # Update project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"$CURRENT\"/CURRENT_PROJECT_VERSION: \"$NEW\"/" project.yml
          echo "Build number incremented from $CURRENT to $NEW"

      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate

      - name: Install Fastlane
        working-directory: ios
        run: |
          gem install bundler
          bundle install || gem install fastlane

      - name: Create App Store Connect API Key
        working-directory: ios/fastlane
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          cat > app_store_connect_api_key.json <<EOF
          {
            "key_id": "$API_KEY_ID",
            "issuer_id": "$API_ISSUER_ID",
            "key": "$API_KEY",
            "in_house": false
          }
          EOF

      - name: Setup Keychain for Code Signing
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Set default keychain
          security default-keychain -s build.keychain

          # Unlock keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Set keychain timeout to 1 hour and disable lock on sleep
          security set-keychain-settings -t 3600 -u build.keychain

          # Add keychain to search list
          security list-keychains -d user -s build.keychain

      - name: Build and Upload to TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          KEYCHAIN_NAME: build.keychain
          KEYCHAIN_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: fastlane beta
