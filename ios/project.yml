name: Reppy
options:
  bundleIdPrefix: com.reppy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "28"
    DEVELOPMENT_TEAM: 9M9375N2XL
    CODE_SIGN_STYLE: Automatic

packages:
  PipecatClientIOSDaily:
    url: https://github.com/pipecat-ai/pipecat-client-ios-daily
    from: "1.0.0"

targets:
  Reppy:
    type: application
    platform: iOS
    sources:
      - path: ../Reppy
        excludes:
          - "**/.DS_Store"
      - path: ../Shared
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: PipecatClientIOSDaily
      - target: ReppyWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abish.reppy
        INFOPLIST_FILE: ../Reppy/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: ../Reppy/Resources/Reppy.entitlements

  ReppyWidgetExtension:
    type: app-extension
    platform: iOS
    productName: ReppyWidgetExtension
    sources:
      - path: ../ReppyWidget
        excludes:
          - "**/.DS_Store"
      - path: ../Shared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abish.reppy.widget
        INFOPLIST_FILE: ../ReppyWidget/Info.plist
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: ../ReppyWidget/ReppyWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  ReppyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../ReppyWatch
        excludes:
          - "**/.DS_Store"
      - path: ../Shared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abish.reppy.watch
        INFOPLIST_FILE: ../ReppyWatch/Info.plist
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: ../ReppyWatch/ReppyWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  Reppy:
    build:
      targets:
        Reppy: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  ReppyWidgetExtension:
    build:
      targets:
        ReppyWidgetExtension: all
        Reppy: all
    run:
      config: Debug
      environmentVariables:
        _XCWidgetKind: CaloriesWidget
        _XCWidgetDefaultView: timeline
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
